openapi: 3.0.3
info:
  title: AI Reverse Engineering Assistant
  version: 1.0.0
  description: Evidence-first static reverse-engineering assistant API.
servers:
  - url: http://localhost:8000/api/v1
    description: Local API
paths:
  /analyses:
    post:
      summary: Upload a binary for analysis
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Analysis created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  status:
                    type: string
        '400':
          description: Bad request
        '413':
          description: Payload too large
        '429':
          description: Queue full
  /analyses/{analysis_id}/status:
    get:
      summary: Get analysis status
      parameters:
        - in: path
          name: analysis_id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Status snapshot
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  status:
                    type: string
                  stage:
                    type: string
                  progress:
                    type: integer
                  decomp_status:
                    type: string
                    enum: [OK, FAILED, TIMEOUT, NOT_RUN]
                  ai_status:
                    type: string
                    enum: [OK, DEGRADED, DISABLED, NOT_RUN, FAILED]
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
        '404':
          description: Not found
  /analyses/{analysis_id}/overview:
    get:
      summary: Get analysis overview
      parameters:
        - in: path
          name: analysis_id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Overview
          content:
            application/json:
              schema:
                type: object
                properties:
                  file:
                    type: object
                    properties:
                      filename:
                        type: string
                      format:
                        type: string
                      arch:
                        type: string
                      size:
                        type: integer
                      entry_point:
                        type: string
                  hashes:
                    type: object
                    properties:
                      sha256:
                        type: string
                      md5:
                        type: string
                  risk:
                    type: object
                    properties:
                      score:
                        type: integer
                      rating:
                        type: string
                      breakdown:
                        type: array
                        items:
                          type: object
                          properties:
                            title:
                              type: string
                            weight:
                              type: integer
                  top_findings:
                    type: array
                    items:
                      type: object
                  counts:
                    type: object
                    properties:
                      sections:
                        type: integer
                      imports:
                        type: integer
                      strings:
                        type: integer
                      functions:
                        type: integer
                      findings:
                        type: integer
                  versions:
                    type: object
                    properties:
                      scoring:
                        type: string
                      rules:
                        type: string
                      schema:
                        type: string
                  states:
                    type: object
                    properties:
                      status:
                        type: string
                      decomp_status:
                        type: string
                      ai_status:
                        type: string
                      source:
                        type: string
                  ai_report:
                    type: object
                    nullable: true
                    properties:
                      schema_version:
                        type: string
                      verdict:
                        type: string
                        enum: [LIKELY_MALICIOUS, LIKELY_BENIGN, INCONCLUSIVE]
                      summary:
                        type: string
                      evidence_ids:
                        type: array
                        items:
                          type: string
                      rationale:
                        type: string
                      uncertainty:
                        type: string
                      limitations:
                        type: array
                        items:
                          type: string
                      disclaimer:
                        type: string
                      generated_at:
                        type: string
                      model:
                        type: string
                      input_sha256:
                        type: string
                      stages:
                        type: object
                      tokens_used:
                        type: integer
                      tool_calls:
                        type: integer
                  prior_ids:
                    type: array
                    items:
                      type: string
        '404':
          description: Not found
  /analyses/{analysis_id}/functions:
    get:
      summary: List functions
      parameters:
        - in: path
          name: analysis_id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Function list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        address:
                          type: string
                        name:
                          type: string
                        centrality:
                          type: number
                        decompiler_status:
                          type: string
                        decompiled_excerpt:
                          type: string
                        artifact_available:
                          type: boolean
                  next_cursor:
                    type: string
        '404':
          description: Not found
  /analyses/{analysis_id}/functions/{fid}:
    get:
      summary: Get function detail
      parameters:
        - in: path
          name: analysis_id
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: fid
          required: true
          schema:
            type: string
        - in: query
          name: load_full
          schema:
            type: boolean
      responses:
        '200':
          description: Function detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  address:
                    type: string
                  name:
                    type: string
                  centrality:
                    type: number
                  decompiler_status:
                    type: string
                  decompiled_excerpt:
                    type: string
                    nullable: true
                  artifact_available:
                    type: boolean
                  ai_summary:
                    type: object
                    nullable: true
                    properties:
                      schema_version:
                        type: string
                      function_id:
                        type: string
                      purpose:
                        type: string
                      behavior:
                        type: array
                        items:
                          type: string
                      evidence_ids:
                        type: array
                        items:
                          type: string
                      suspicious_indicators:
                        type: array
                        items:
                          type: string
                      uncertainty:
                        type: string
                      alternative_explanation:
                        type: string
                      suggested_technique_id:
                        type: string
                        nullable: true
                      rationale:
                        type: string
                  decompiled_full:
                    type: string
                    nullable: true
                  artifact_truncated:
                    type: boolean
        '404':
          description: Not found
  /ai/status:
    get:
      summary: AI configuration status
      responses:
        '200':
          description: AI status
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled:
                    type: boolean
                  provider:
                    type: string
                  model:
                    type: string
                    nullable: true
                  endpoint_host:
                    type: string
                    nullable: true
                  reason:
                    type: string
                    nullable: true
  /ai/test:
    post:
      summary: Test AI connection
      responses:
        '200':
          description: Connection OK
        '503':
          description: AI disabled
        '502':
          description: Provider unavailable
  /ai/analyses/{analysis_id}/functions/{function_id}/summary:
    post:
      summary: Ask AI for one function summary
      description: Generate and persist one function summary after an explicit user action. No other functions are summarized by this request.
      parameters:
        - in: path
          name: analysis_id
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: function_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Validated function summary
        '404':
          description: Analysis or function not found
        '409':
          description: Static analysis is still running
        '502':
          description: Model could not produce a validated summary
  /ai/internal/analyses/{analysis_id}/tool:
    post:
      summary: Execute one allow-listed static-analysis tool
      description: |
        API-mediated static tool execution for the bounded AI pipeline.
        Only the worker with the pipeline token may invoke it. Tools read
        persisted bounded static evidence; raw file bytes and paths are never
        exposed.
      parameters:
        - in: path
          name: analysis_id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: ["tool"]
              properties:
                tool:
                  type: string
                  enum:
                    - analysis.metadata
                    - analysis.strings
                    - analysis.functions
                    - analysis.function_detail
                    - analysis.findings
                    - analysis.imports
                  description: One of the allow-listed static-analysis tools.
                arguments:
                  type: object
                  description: Tool-specific validated arguments.
      responses:
        '200':
          description: Tool result
          content:
            application/json:
              schema:
                type: object
                properties:
                  analysis_id:
                    type: string
                    format: uuid
                  tool:
                    type: string
                  budget:
                    type: object
                    properties:
                      calls:
                        type: integer
                      calls_remaining:
                        type: integer
                      output_bytes:
                        type: integer
                  result:
                    type: object
        '400':
          description: Unknown tool or invalid argument
        '403':
          description: Pipeline authorization failed
        '404':
          description: Analysis or referenced item not found
        '429':
          description: Tool budget exceeded
components:
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
security: []
