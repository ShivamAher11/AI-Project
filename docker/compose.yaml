services:
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - frontend-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://app:app-local-password@postgres:5432/analysis}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
      DATA_ROOT: ${DATA_ROOT:-/data}
      MAX_FILE_MB: ${MAX_FILE_MB:-100}
      TTL_HOURS: ${TTL_HOURS:-24}
    ports:
      - "8000:8000"
    volumes:
      - uploads:/data/uploads
      - artifacts:/data/artifacts
      - ../tests:/tests:ro
      - ../fixtures:/fixtures:ro
      - ../shared:/shared:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - frontend-net
      - backend-internal
      - api-egress
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: worker/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://app:app-local-password@postgres:5432/analysis}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      DATA_ROOT: ${DATA_ROOT:-/data}
      PLACEHOLDER_STAGE_DELAY_S: ${PLACEHOLDER_STAGE_DELAY_S:-0.35}
      GHIDRA_MODE: ${GHIDRA_MODE:-fixture}
    volumes:
      - uploads:/data/uploads
      - artifacts:/data/artifacts
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend-internal
    deploy:
      resources:
        limits:
          memory: 8g
        reservations:
          memory: 4g
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.celery_app:celery_app inspect ping --timeout=4 | grep -q pong"]
      interval: 15s
      timeout: 6s
      retries: 3
      start_period: 20s
    restart: on-failure:3

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    networks:
      - backend-internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  postgres:
    image: postgres:16.15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-analysis}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app-local-password}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  uploads:
  artifacts:
  pgdata:
  redisdata:

networks:
  frontend-net:
    driver: bridge
  backend-internal:
    driver: bridge
    internal: true
  api-egress:
    driver: bridge
